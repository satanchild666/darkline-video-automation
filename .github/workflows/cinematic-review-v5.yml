name: Darkline V5 cinematic review
on:
  push:
    branches: [dev/video-dedup-v1]
    paths: ['.github/workflows/cinematic-review-v5.yml','video/cinematic_preview_v5.py']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install preview dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q Pillow numpy playwright
          python -m playwright install --with-deps chromium
      - name: Capture real demo and render 3D perspective motion
        run: python video/cinematic_preview_v5.py
      - name: Verify technical output
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json cinematic-preview/Darkline_cinematic_V5.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Darkline-cinematic-V5-REVIEW
          path: |
            cinematic-preview/Darkline_cinematic_V5.mp4
            cinematic-preview/storyboard.jpg
            cinematic-preview/scene-*.jpg
          retention-days: 14
