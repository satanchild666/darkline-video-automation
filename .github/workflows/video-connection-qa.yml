name: Darkline video connection QA
on:
  push:
    branches: [dev/video-dedup-v1]
    paths:
      - '.github/workflows/video-connection-qa.yml'
      - 'video/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only authenticated Worker connection test
        env:
          DARKLINE_TEST_TOKEN: ${{ secrets.DARKLINE_TEST_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          token=os.environ.get('DARKLINE_TEST_TOKEN','')
          if len(token)<32: raise SystemExit('Missing configured token')
          req=urllib.request.Request('https://darkline-ai-growth.marksz0430.workers.dev/test-buffer', data=b'{}', method='POST', headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'DarklineStudioVideoAutomation/1.0 (GitHub Actions)','x-darkline-test-token':token})
          try:
              with urllib.request.build_opener(NoRedirect()).open(req,timeout=60) as resp:
                  result=json.loads(resp.read(262144))
                  if result.get('status')!='BUFFER_CONNECTED': raise SystemExit('Unexpected connection response')
                  print('AUTHENTICATED_WORKER_CONNECTION_OK')
          except urllib.error.HTTPError as e:
              body=e.read(1000)
              print('HTTP_STATUS',e.code,'CLOUDFLARE_1010',b'1010' in body)
              raise SystemExit(1)
          PY
      - name: Compile Python files
        if: always()
        run: python -m py_compile video/publish_automation.py video/video_dedup.py video/test_video_dedup.py
      - name: Run MP4 regression tests
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m unittest discover -s video -p 'test_video_dedup.py' -v
