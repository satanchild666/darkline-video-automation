name: Darkline V12.5.6 - ZONOS2 Hungarian ASR quality-gated video
on:
  push:
    branches: ['dev/v12.5.1-moss-private-review']
    paths: ['.github/workflows/zonos-v1256-video-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: darkline-zonos-v1256-private
  cancel-in-progress: false
jobs:
  voice-review:
    if: github.ref == 'refs/heads/dev/v12.5.1-moss-private-review'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ZONOS_QUANT: q4_k
    steps:
      - name: Check private reference availability without exposing it
        env:
          DARKLINE_MOSS_REFERENCE_B64: ${{ secrets.DARKLINE_MOSS_REFERENCE_B64 }}
        run: |
          python - <<'PY'
          import os,base64
          s=os.environ.get("DARKLINE_MOSS_REFERENCE_B64","")
          if not s:raise SystemExit("MOSS_REFERENCE_MISSING: configure the existing prepared reference as an Actions secret; no synthesis attempted")
          try:b=base64.b64decode(s,validate=True)
          except Exception:raise SystemExit("MOSS_REFERENCE_INVALID")
          if not 1000<=len(b)<=48000 or not b.startswith(b"OggS"):raise SystemExit("MOSS_REFERENCE_INVALID")
          print("MOSS_REFERENCE_AVAILABLE")
          PY
      - name: Checkout exact approved renderer for existing encryption only
        uses: actions/checkout@v4
        with:
          ref: 0578b45ee0c1a75265d53c43558583d6e55976e8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned ZONOS2 CPU runtime and download open model
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg cmake build-essential fonts-dejavu-core
          git clone --no-checkout https://github.com/Zyphra/zonos2.cpp.git "$RUNNER_TEMP/zonos"
          git -C "$RUNNER_TEMP/zonos" checkout --detach 66b8005eeec16c068cdc8c4f43f7014682e1f4cb
          git -C "$RUNNER_TEMP/zonos" submodule update --init --recursive
          cmake -S "$RUNNER_TEMP/zonos" -B "$RUNNER_TEMP/zonos/build" -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF
          cmake --build "$RUNNER_TEMP/zonos/build" --target zonos2-cli -j 4
          python -m pip install -q 'numpy>=1.26,<3' cryptography huggingface_hub 'Pillow>=11,<13' playwright 'faster-whisper==1.2.1'
          python -m playwright install --with-deps chromium
          python video/autonomous_daily_v124.py --selftest
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi,snapshot_download
          root=Path(os.environ["RUNNER_TEMP"])/"zonos"/"models"
          repo="Zyphra/ZONOS2-GGUF"
          sha="75c877ec8ac86dda42bfc0e9968c87f29e10ef57"
          print("ZONOS_MODEL_REVISION",sha)
          snapshot_download(repo_id=repo,revision=sha,allow_patterns=["zonos2-"+os.environ["ZONOS_QUANT"]+".gguf","dac.gguf","spk-encoder.gguf"],local_dir=root)
          PY
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi,snapshot_download
          repo="Systran/faster-whisper-small"
          revision=HfApi().model_info(repo).sha
          root=Path(os.environ["RUNNER_TEMP"])/"zonos"/"asr"
          snapshot_download(repo_id=repo,revision=revision,local_dir=root,allow_patterns=["config.json","model.bin","tokenizer.json","vocabulary.*","preprocessor_config.json"])
          (root/"revision.txt").write_text(revision)
          print("V1256_ASR_MODEL_REVISION",revision)
          PY
          test -s "$RUNNER_TEMP/zonos/asr/model.bin"
          test -s "$RUNNER_TEMP/zonos/models/zonos2-$ZONOS_QUANT.gguf"
          test -s "$RUNNER_TEMP/zonos/models/dac.gguf"
          test -s "$RUNNER_TEMP/zonos/models/spk-encoder.gguf"
      - name: Restore reference into ephemeral private directory
        env:
          DARKLINE_MOSS_REFERENCE_B64: ${{ secrets.DARKLINE_MOSS_REFERENCE_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/darkline-private"
          python - <<'PY'
          import os,base64
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"darkline-private"/"reference.ogg"
          p.write_bytes(base64.b64decode(os.environ["DARKLINE_MOSS_REFERENCE_B64"],validate=True))
          PY
          ffmpeg -nostdin -v error -i "$RUNNER_TEMP/darkline-private/reference.ogg" -ac 1 -ar 48000 "$RUNNER_TEMP/darkline-private/reference.wav"
          rm "$RUNNER_TEMP/darkline-private/reference.ogg"
      - name: Generate, transcribe and selectively retry ten Hungarian scenes
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import os,sys,re,json,subprocess,wave,math,io,zipfile
          from pathlib import Path
          import numpy as np
          from cryptography.hazmat.primitives import serialization
          sys.path.insert(0,str(Path.cwd()/"video"))
          import daily_catalogue_v124 as cat
          import private_review_v111 as seal
          import private_review_v113 as base
          public="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEApp/0kvJL+cWi3tAxxwz0\nQgOqMjwCofTXHePX84IRVpQqlPCu67nwUD5Wec5Xa74S7Mw2mrq6AaVjUTgR9Z8O\nQPoykgacXI0mhODYA+9U1CTDf1Bib3xi6O2aQnq3iDTbLNzuF964HY5y/UEa+8H4\nVByAhKNW52Uxa62N8nZOdQGq4rDT8MMUQ3dzkjyq9XIya9Sf8etq6V09co/fmT57\n4+bMv94AkqqD/lqRHWXSmHNUp+0DykokI4NBJ5ZI8dKOI+G9qJCP+bPQKK5Kt+zH\nmOY/eD29UHYDbwhY5fv982MrWTrXZVtm2zW94VeIw5iUl8Wvu1oVK6q2oAR1mWny\nCWpgEt9mZab6sAoKBRdFn0n+EltD+W7TqMRlSsH3IYCwP/BP6X5DGmU2emNFinav\norF72xOYYgkv4BRy7HpebmRqQSZkM0vQdD+QMGotXsrzqi3nbnjPwRkLKTr+v20b\nqx6aCWOdhM8J9owChiOL2mwY5HU2lXdbGGxm7YCVxOz1AgMBAAE=\n-----END PUBLIC KEY-----\n".encode("ascii")
          d=Path(os.environ["RUNNER_TEMP"])/"darkline-private"
          z=Path(os.environ["RUNNER_TEMP"])/"zonos"
          sealed=Path(os.environ["RUNNER_TEMP"])/"darkline-sealed";sealed.mkdir(exist_ok=True)
          cli=next(p for p in (z/"build").rglob("zonos2-cli") if p.is_file() and os.access(p,os.X_OK))
          t=next(t for t in cat.TOPICS if t.key=="quote")
          phrases=[
              "Van egy ötleted, de nem tudod, hogyan indulj el?",
              "Először nézzük meg, mi nehezíti a mindennapi munkádat.",
              "Az okos ajánló megmutatja a lehetséges digitális megoldásokat.",
              "Az árbecslő segít az előzetes tervezésben.",
              "Egyedi rendszerre van szükséged? Arról is egyeztethetünk.",
              "Az ajánlatkérőben egyszerűen összefoglalhatod az igényeidet.",
              "A fejlesztés előtt közösen tisztázzuk a feladatokat.",
              "A gyakori kérdések között további információkat találsz.",
              "Ha kérdésed van, írásban is elérsz minket.",
              "Kérj személyre szabott ajánlatot a Darkline Studio oldalán!"
          ]
          assert len(phrases)==len(t.scenes)==10
          from faster_whisper import WhisperModel
          import unicodedata
          asr=WhisperModel(str(z/"asr"),device="cpu",compute_type="int8",cpu_threads=2,local_files_only=True)
          def words(s):
              # Preserve Hungarian accents and word content; ignore case and punctuation only.
              s=unicodedata.normalize("NFC",s).casefold()
              return re.findall(r"[^\W_]+",s,flags=re.UNICODE)
          def edit(a,b):
              row=list(range(len(b)+1))
              for i,x in enumerate(a,1):
                  nxt=[i]
                  for j,y in enumerate(b,1):nxt.append(min(nxt[-1]+1,row[j]+1,row[j-1]+(x!=y)))
                  row=nxt
              return row[-1]
          assert edit(words("Ár, becslő!"),words("ár becslő"))==0
          assert edit(words("egy két három"),words("egy két"))==1
          assert words("ár")!=words("ar")
          sr=48000;parts=[np.zeros(round(.12*sr),np.float32)];cursor=len(parts[0]);records=[];details=[]
          for i,text in enumerate(phrases):
              expected=words(text)
              attempts=[];best=None
              for attempt,seed in enumerate((125201,125607+i*17,125609+i*17),1):
                  wav=d/f"scene-{i:02d}-{attempt}.wav"
                  cmd=[str(cli),str(z/"models/zonos2-q4_k.gguf"),"--dac",str(z/"models/dac.gguf"),"--tts",text,str(wav),"--clone",str(d/"reference.wav"),"--spk-encoder",str(z/"models/spk-encoder.gguf"),"--seed",str(seed),"--max","1600"]
                  try:
                      r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,check=True,timeout=180)
                      matches=re.findall(r"tts:\s*(\d+) frames, eos_frame=(-?\d+)",r.stdout)
                      if not matches:raise RuntimeError("EOS not verified")
                      frames,eos=map(int,matches[-1])
                      if not 0<=eos<frames<1600:raise RuntimeError("incomplete generation")
                      a=np.frombuffer(subprocess.check_output(["ffmpeg","-v","error","-i",str(wav),"-ac","1","-ar",str(sr),"-f","f32le","-"]),dtype="<f4").copy()
                      peak=float(np.max(np.abs(a)));rms=float(np.sqrt(np.mean(a*a)))
                      if not 1<=len(a)/sr<=18.6 or not np.isfinite(a).all() or not .005<peak<.999 or rms<.003:raise RuntimeError("invalid waveform")
                      segs,_=asr.transcribe(str(wav),language="hu",beam_size=5,temperature=0,condition_on_previous_text=False,vad_filter=False,word_timestamps=True)
                      segs=list(segs);heard=" ".join(s.text.strip() for s in segs);actual=words(heard)
                      wer=edit(expected,actual)/len(expected)
                      stamps=[w for s in segs for w in (s.words or []) if w.end>w.start]
                      active=max(.1,stamps[-1].end-stamps[0].start) if stamps else len(a)/sr
                      rate=len(actual)/active
                      # Exact match strongly preferred. For short sentences, one error is not silently accepted.
                      # No prompt with target words: the recognizer must independently hear the utterance.
                      exact=(wer==0)
                      tail_ok=len(actual)>=2 and actual[-2:]==expected[-2:]
                      rate_ok=1.3<=rate<=3.5
                      acceptable=exact and tail_ok and rate_ok
                      detail={"attempt":attempt,"seed":seed,"seconds":len(a)/sr,"frames":frames,"eos_frame":eos,"peak":peak,"rms":rms,"transcript":heard,"wer":wer,"tail_ok":tail_ok,"words_per_second":rate,"asr_gate":"PASS" if acceptable else "REVIEW"}
                      attempts.append(detail)
                      rank=(not acceptable,wer,not tail_ok,not rate_ok,abs(rate-2.4))
                      if best is None or rank<best[0]:best=(rank,a,detail)
                      print("V1256_ATTEMPT",i+1,attempt,"WER",round(wer,3),"RATE",round(rate,2),detail["asr_gate"],flush=True)
                      if acceptable:break
                  except (RuntimeError,subprocess.SubprocessError,ValueError) as error:
                      attempts.append({"attempt":attempt,"seed":seed,"error":type(error).__name__})
                      print("V1256_ATTEMPT_TECHNICAL_REJECT",i+1,attempt,type(error).__name__,flush=True)
              if best is None:raise RuntimeError(f"Scene {i+1}: no valid audio after bounded retries")
              _,a,chosen=best
              peak=chosen["peak"];rms=chosen["rms"]
              gain=min(2.0,10**(-18/20)/rms,.78/peak)
              a*=gain
              start=cursor/sr;parts.append(a);cursor+=len(a);end=cursor/sr
              records.append({"scene":i,"start":start,"end":end,"text":text})
              details.append({"scene":i+1,"text":text,**chosen,"gain":gain,"attempts":attempts})
              if i<9:
                  gap=np.zeros(round(.30*sr),np.float32);parts.append(gap);cursor+=len(gap)
              print("V1256_SENTENCE_SELECTED",i+1,chosen["asr_gate"],"seed",chosen["seed"],flush=True)
          a=np.concatenate(parts);duration=len(a)/sr
          out=d/"review";out.mkdir()
          with wave.open(str(out/"private_voice.wav"),"wb") as w:
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr);w.writeframes((np.clip(a,-1,1)*32767).astype("<i2").tobytes())
          q={"engine":"ZONOS2-q4_k","seed":125201,"model_revision":"75c877ec8ac86dda42bfc0e9968c87f29e10ef57","sentences":details,"duration":duration,"speech_seconds":sum(x["seconds"] for x in details),"publication":False,"paid_api":False,"owner_approved":False,"human_pronunciation_review":"required","previous_owner_rating":[4,2,2,2,2],"visual_owner_rating":[5,5,5,5,5],"asr_model":"Systran/faster-whisper-small","asr_revision":(z/"asr"/"revision.txt").read_text(),"asr_passed_scenes":sum(x["asr_gate"]=="PASS" for x in details),"asr_gate":"PASS" if all(x["asr_gate"]=="PASS" for x in details) else "REVIEW","attempt_limit":3,"timing_method":"actual concatenated sentence waveform boundaries, not word alignment"}
          (out/"narration.json").write_text(json.dumps({"phrases":phrases,"records":records,"quality":q},ensure_ascii=False,indent=2))
          (out/"voice_provenance.json").write_text(json.dumps(q,ensure_ascii=False,indent=2))
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,"w",zipfile.ZIP_DEFLATED) as b:
              b.write(out/"private_voice.wav","Darkline_V1256_narration.wav")
              b.write(out/"narration.json","narration.json")
          (sealed/"Darkline_V1256_voice.dlenc").write_bytes(seal.seal(buf.getvalue(),serialization.load_pem_public_key(public)))
          print("V1256_NARRATION_READY",json.dumps(q,ensure_ascii=False),flush=True)
          PY
      - name: Upload encrypted narration review
        uses: actions/upload-artifact@v4
        with:
          name: Darkline-V1256-ENCRYPTED-NARRATION
          path: ${{ runner.temp }}/darkline-sealed/Darkline_V1256_voice.dlenc
          if-no-files-found: error
          retention-days: 3
      - name: Render with the exact V12.4.4 visual engine and real sentence timing
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import os,sys,json,math,copy,subprocess,wave,zipfile,io
          from pathlib import Path
          from dataclasses import replace
          import numpy as np
          from cryptography.hazmat.primitives import serialization
          sys.path.insert(0,str(Path.cwd()/"video"))
          import focused_renderer_v124 as render
          import daily_catalogue_v124 as cat
          import private_review_v113 as base
          import private_review_v111 as seal
          public="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEApp/0kvJL+cWi3tAxxwz0\nQgOqMjwCofTXHePX84IRVpQqlPCu67nwUD5Wec5Xa74S7Mw2mrq6AaVjUTgR9Z8O\nQPoykgacXI0mhODYA+9U1CTDf1Bib3xi6O2aQnq3iDTbLNzuF964HY5y/UEa+8H4\nVByAhKNW52Uxa62N8nZOdQGq4rDT8MMUQ3dzkjyq9XIya9Sf8etq6V09co/fmT57\n4+bMv94AkqqD/lqRHWXSmHNUp+0DykokI4NBJ5ZI8dKOI+G9qJCP+bPQKK5Kt+zH\nmOY/eD29UHYDbwhY5fv982MrWTrXZVtm2zW94VeIw5iUl8Wvu1oVK6q2oAR1mWny\nCWpgEt9mZab6sAoKBRdFn0n+EltD+W7TqMRlSsH3IYCwP/BP6X5DGmU2emNFinav\norF72xOYYgkv4BRy7HpebmRqQSZkM0vQdD+QMGotXsrzqi3nbnjPwRkLKTr+v20b\nqx6aCWOdhM8J9owChiOL2mwY5HU2lXdbGGxm7YCVxOz1AgMBAAE=\n-----END PUBLIC KEY-----\n".encode("ascii")
          out=Path(os.environ["RUNNER_TEMP"])/"darkline-private"/"review"
          data=json.loads((out/"narration.json").read_text());q=data["quality"];rec=data["records"];duration=q["duration"]
          topic=next(t for t in cat.TOPICS if t.key=="quote")
          topic=replace(topic,scenes=tuple((*r[:3],s) for r,s in zip(topic.scenes,data["phrases"])))
          # No HeyGen calls: guard any accidental path before using the existing visual code.
          def blocked(*a,**kw):raise RuntimeError("Paid/external voice API is disabled for this review")
          base.voice.authorize=blocked;base.voice.speech=blocked
          base.voice.MODEL="ZONOS2-q4_k"
          p=copy.deepcopy(render.v.PLANS["web"]);p["min_open"]=.8
          base.STORIES["web"]=[(r[0],"unused",r[3]) for r in topic.scenes]
          edges=base.layout(rec,duration)
          caps=[{"scene":i,"start":r["start"],"end":r["end"],"text":r["text"]} for i,r in enumerate(rec)]
          sr=48000
          a=np.frombuffer(subprocess.check_output(["ffmpeg","-v","error","-i",str(out/"private_voice.wav"),"-ac","1","-ar",str(sr),"-f","f32le","-"]),dtype="<f4")
          total=edges[-1]/30
          track=np.zeros(round(total*sr),np.float32);track[:len(a)]=a
          # Original synthesized music bed and ducking; retain the approved visual renderer.
          bed=np.zeros_like(track);beat=60/p["bpm"]
          for j,b in enumerate(np.arange(0,total,beat)):
              start=round(b*sr);end=min(len(track),start+round(beat*sr));z=np.arange(end-start)/sr
              bed[start:end]+=(.12*np.sin(2*np.pi*(78*z-52*z*z))*np.exp(-z*14)*(z<.35)).astype(np.float32)
              for k in (1,1.25,1.5):bed[start:end]+=(.027*np.sin(2*np.pi*130.8*k*[1,1,1.122,1.335][j%4]*z)*np.exp(-z*3)).astype(np.float32)
          duck=np.ones_like(track)*.58
          for r in rec:duck[max(0,round((r["start"]-.08)*sr)):min(len(track),round((r["end"]+.12)*sr))]=.20
          duck=np.convolve(duck,np.ones(1200,np.float32)/1200,mode="same")
          mix=track+bed*duck
          fade=round(.4*sr);mix[-fade:]*=np.linspace(1,0,fade)
          mix*=min(1,.89/max(float(np.max(np.abs(mix))),1e-6))
          with wave.open(str(out/"mix.wav"),"wb") as w:
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr);w.writeframes((mix*32767).astype("<i2").tobytes())
          (out/"captions.srt").write_text("\n\n".join(f"{i+1}\n{base.voice.stamp(r['start'])} --> {base.voice.stamp(r['end'])}\n{r['text']}" for i,r in enumerate(caps))+"\n",encoding="utf8")
          (out/"narration_timing.json").write_text(json.dumps({"scenes":rec,"captions":caps,"frame_boundaries":edges,"method":"sentence waveform boundaries, not word-level alignment"},ensure_ascii=False,indent=2))
          shots,audit=render.capture(topic,out)
          movie=render.render(topic,out,shots,edges,caps)
          report,fp=base.check(render.v,"web",p,out,movie,rec,edges,caps,duration,{"source":"public_dom","overlay_dom_checks":"passed"})
          subprocess.run(["ffmpeg","-v","error","-xerror","-i",str(movie),"-f","null","-"],check=True)
          report.update({"topic":topic.key,"voice_engine":"ZONOS2-q4_k","profile":"neutral Q4, bounded ASR-guided seed selection","model":"ZONOS2-q4_k","visual_renderer_commit":"0578b45ee0c1a75265d53c43558583d6e55976e8","eos_verified_sentences":len(q["sentences"]),"asr_gate":q["asr_gate"],"asr_passed_scenes":q["asr_passed_scenes"],"asr_model":q["asr_model"],"publish_gate":"BLOCKED_PENDING_OWNER_APPROVAL","speech_timing":"sentence-level","min_projected_text_px":min(a["minimum_projected_px"] for a in audit),"paid_api":False,"publication":False,"owner_approved":False,"decode":"PASS"})
          if q["asr_gate"]!="PASS":
              report["reasons"].append("asr_content_or_tempo_review_required");report["review_gate"]="REJECT"
          (out/"quality.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,"w",zipfile.ZIP_DEFLATED) as b:
              for n in ("daily.mp4","quality.json","storyboard.jpg","captions.srt","narration_timing.json","voice_provenance.json","capture_report.json","fingerprint.json"):b.write(out/n,"Darkline_V1256_review.mp4" if n=="daily.mp4" else n)
          sealed=Path(os.environ["RUNNER_TEMP"])/"darkline-sealed"
          (sealed/"Darkline_V1256_video.dlenc").write_bytes(seal.seal(buf.getvalue(),serialization.load_pem_public_key(public)))
          print("V1256_VIDEO_RESULT",json.dumps(report,ensure_ascii=False),flush=True)
          if report["review_gate"]!="PASS":raise RuntimeError("Technical video review rejected; no publication")
          PY
      - name: Upload encrypted video review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Darkline-V1256-ENCRYPTED-VIDEO
          path: ${{ runner.temp }}/darkline-sealed/Darkline_V1256_video.dlenc
          if-no-files-found: warn
          retention-days: 3
      - name: Remove temporary reference and generated private media
        if: always()
        run: rm -rf "$RUNNER_TEMP/darkline-private" "$RUNNER_TEMP/darkline-sealed" "$RUNNER_TEMP/zonos"
