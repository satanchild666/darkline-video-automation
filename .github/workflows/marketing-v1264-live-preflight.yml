name: Darkline V12.6.4 - live Worker and HeyGen account preflight
on:
  push:
    branches: ['dev/v12.5.1-moss-private-review']
    paths: ['.github/workflows/marketing-v1264-live-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-read-only:
    if: github.ref == 'refs/heads/dev/v12.5.1-moss-private-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify live morning route, existing video route and API wallet without generation
        env:
          DARKLINE_TEST_TOKEN: ${{ secrets.DARKLINE_TEST_TOKEN }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
        run: |
          PYTHONPATH=video python - <<'PY'
          import datetime as dt, json, os, re
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError,URLError
          from zoneinfo import ZoneInfo
          from marketing_daily_v1263 import worker,preflight
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*a,**kw):return None
          now=dt.datetime.now(dt.timezone.utc)
          day=now.astimezone(ZoneInfo("Europe/Budapest")).date().isoformat()
          token=os.environ["DARKLINE_TEST_TOKEN"]
          assert len(token)>=32
          status,_=worker("/posts-v126-morning",{"date":day,"dryRun":True},"")
          assert status==403
          status,morning=worker("/posts-v126-morning",{"date":day,"dryRun":True},token)
          assert status==200 and morning.get("status")=="V126_MORNING_PREFLIGHT_OK" and morning.get("sideEffects") is False
          print("V1264_MORNING_LIVE_READ",json.dumps(morning),flush=True)
          print("V1264_VIDEO_LIVE_READ",json.dumps(preflight(now,token)),flush=True)
          key=os.environ["HEYGEN_API_KEY"];voice=os.environ["HEYGEN_VOICE_ID"]
          assert key and re.fullmatch(r"[a-f0-9]{32}",voice)
          req=Request("https://api.heygen.com/v2/user/remaining_quota",headers={"X-Api-Key":key,"Accept":"application/json"})
          try:
              with build_opener(NoRedirect()).open(req,timeout=30) as r:
                  d=json.loads(r.read(16384))
              q=d.get("data") or {}
              fields={k:v for k,v in q.items() if isinstance(v,(int,float)) and not isinstance(v,bool) and re.fullmatch(r"[a-z_]*(quota|credit|balance|usd|amount)[a-z_]*",k)}
              print("V1264_HEYGEN_QUOTA_READ",json.dumps({"numeric_fields":fields,"field_names":sorted(q.keys()),"generation":False}),flush=True)
          except (HTTPError,URLError) as e:
              print("V1264_HEYGEN_QUOTA_UNAVAILABLE",getattr(e,"code","transport"),flush=True)
          print("V1264_READ_ONLY_PASS no post, no voice, no budget claim",flush=True)
          PY
