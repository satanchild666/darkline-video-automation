name: Darkline V4 depth review
on:
  push:
    branches: [dev/video-dedup-v1]
    paths: ['.github/workflows/depth-review-v4.yml','video/depth_preview_v4.py']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install preview dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q Pillow numpy playwright
          python -m playwright install --with-deps chromium
      - name: Capture real demo and render 3D perspective motion
        run: python video/depth_preview_v4.py
      - name: Verify technical output
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json depth-preview/Darkline_depth_V4.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Darkline-depth-V4-REVIEW
          path: |
            depth-preview/Darkline_depth_V4.mp4
            depth-preview/storyboard.jpg
            depth-preview/scene-*.jpg
          retention-days: 14
