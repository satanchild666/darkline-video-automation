name: Darkline V6 motion cinematic review
on:
  push:
    branches: [dev/video-dedup-v1]
    paths: ['.github/workflows/motion-cinematic-review-v6.yml','video/motion_cinematic_v6.py']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install preview dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q Pillow numpy playwright
          python -m playwright install --with-deps chromium
      - name: Capture real demo and render 3D perspective motion
        run: python video/motion_cinematic_v6.py
      - name: Verify technical output
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json motion-cinematic-v6/Darkline_motion_V6.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Darkline-motion-V6-REVIEW
          path: |
            motion-cinematic-v6/Darkline_motion_V6.mp4
            motion-cinematic-v6/storyboard.jpg
            motion-cinematic-v6/scene-*.jpg
          retention-days: 14
