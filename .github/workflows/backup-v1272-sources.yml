name: Darkline V12.7.2 - source archive only
on:
  push:
    branches: ['dev/v12.5.1-moss-private-review']
    paths: ['.github/workflows/backup-v1272-sources.yml']
permissions:
  contents: read
  actions: read
jobs:
  archive:
    if: github.ref == 'refs/heads/dev/v12.5.1-moss-private-review'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned source snapshots and history metadata, not .git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, re, hashlib, os
          root=pathlib.Path("source-archive");root.mkdir()
          refs={
            "main_live_v12651":"015c58d91a5c16b1ced59474fc5a4d0534fe0c4c",
            "review_v1272":"ea0826b459278c14d452548db0dc622453191a5e",
            "approved_renderer_v124":"0578b45ee0c1a75265d53c43558583d6e55976e8",
            "main_rollback_v125":"609309731a3612a8c19b66e2ba30eb9ff81b60a9",
            "main_v1264":"1bd21e17f452f08d7e53442ac557e4a1bf005578",
            "integration_v1263":"52314847eb6c24dda1c6f6864607c3aba9f0d2a6",
            "integration_v12651":"7a9396e9527e38b8cdb22e7f65e22ed762242a7a",
            "moss_v1251":"5b4fc2083a5eb3c7d805b9084aa91dbf1a75c6ee",
            "video_dedup":"488857ccf718afc2785d7ecd02aebee1d2097146",
            "ledger_production":"d3c0a6b4059fe4936923bad50f9d62b77cd2b6ab",
            "ledger_test":"1f37a256a851894756fa9980f6b2bb677b72200f"}
          allow={".py",".js",".mjs",".cjs",".ts",".tsx",".jsx",".html",".css",".md",".txt",".json",".yaml",".yml",".toml",".sh",".ps1",".svg",".xml",".gitignore",".gitattributes",".lock",".ini",".cfg",".srt"}
          secret=re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[A-Za-z0-9_-]{35}|sk-[A-Za-z0-9_-]{24,}|(?im:(?:api[_-]?key|access[_-]?token|password|client[_-]?secret)\s*[:=]\s*['\x22][A-Za-z0-9_./+\-=]{24,}['\x22])")
          deny=re.compile(r"(^|/)(?:\.env(?:\.|$)|.*\.pem$|.*\.key$|.*\.p12$|.*credentials.*|.*service.account.*|.*reference.*\.(?:txt|wav|mp3|b64)$)",re.I)
          def git(*args):return subprocess.check_output(["git",*args])
          index={};omitted=[]
          for name,ref in refs.items():
              try:
                  git("cat-file","-e",ref+"^{commit}")
                  entries=git("ls-tree","-r","-z",ref).split(b"\0")
              except subprocess.CalledProcessError:
                  index[name]={"ref":ref,"status":"unavailable"};continue
              count=0
              for raw in entries:
                  if not raw:continue
                  meta,p=raw.split(b"\t",1);mode,kind,oid=meta.decode().split();p=p.decode("utf-8")
                  if kind!="blob" or mode=="120000" or deny.search(p):
                      omitted.append([name,p,"path or type blocked"]);continue
                  fp=pathlib.PurePosixPath(p)
                  if fp.suffix.lower() not in allow and fp.name not in ("README","LICENSE","Dockerfile","Makefile",".gitignore",".gitattributes"):
                      omitted.append([name,p,"nontext asset; fetch from repository if safe"]);continue
                  data=git("cat-file","blob",oid)
                  if len(data)>2000000 or b"\0" in data:
                      omitted.append([name,p,"large/binary"]);continue
                  try:s=data.decode("utf-8")
                  except UnicodeError:omitted.append([name,p,"not UTF-8"]);continue
                  if secret.search(s) or re.search(r"[A-Za-z0-9+/]{500,}={0,2}",s):
                      omitted.append([name,p,"possible secret or encoded payload"]);continue
                  dest=root/"snapshots"/name/p;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data);count+=1
              index[name]={"ref":ref,"status":"exported","files":count}
          # Metadata only; do not include author emails, raw commit objects or secret values.
          raw=git("log","--all","--format=%H%x09%P%x09%aI%x09%s").decode("utf-8",errors="replace")
          (root/"commit_history.tsv").write_text("sha\tparents\tdate\tsubject\n"+"\n".join(line if not secret.search(line) else line.split("\t")[0]+"\t[REDACTED]" for line in raw.splitlines())+"\n")
          (root/"snapshot_index.json").write_text(json.dumps(index,indent=2))
          (root/"excluded_paths.json").write_text(json.dumps(omitted,indent=2))
          print("BACKUP_SOURCE_PASS",len(index),"snapshots",sum(x.get("files",0) for x in index.values()),"files",len(omitted),"excluded paths",flush=True)
          # Only safe run metadata; no raw logs (can include personal or secret data).
          try:
              p=subprocess.run(["gh","api","--paginate","repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs?per_page=100","--jq",".workflow_runs[] | {id,name,head_sha,head_branch,status,conclusion,created_at,updated_at,html_url,event,run_attempt}"],capture_output=True,text=True,check=True)
              vals=[json.loads(line) for line in p.stdout.splitlines() if line.strip()]
              (root/"workflow_runs.json").write_text(json.dumps(vals,indent=2))
              print("BACKUP_RUN_METADATA_PASS",len(vals))
          except Exception as e:
              print("BACKUP_RUN_METADATA_UNAVAILABLE",type(e).__name__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Darkline-V1272-SAFE-SOURCE-SNAPSHOTS
          path: source-archive/
          include-hidden-files: true
          retention-days: 7
