name: Darkline V11 private voice review
on:
  workflow_dispatch:
  push:
    branches: [dev/video-dedup-v1]
    paths:
      - 'video/heygen_free_voice_v11.py'
      - 'video/personal_voice_review_v11.py'
      - '.github/workflows/personal-voice-review-v11.yml'
concurrency:
  group: darkline-v11-private-review
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test free-only policy and narration alignment offline
        run: |
          python -m pip install -q numpy
          python -m py_compile video/heygen_free_voice_v11.py video/personal_voice_review_v11.py
          python video/heygen_free_voice_v11.py
  private-preview:
    needs: adapter-tests
    if: vars.DARKLINE_HEYGEN_FREE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check required configuration without displaying secrets
        env:
          DARKLINE_HEYGEN_FREE_ENABLED: 'true'
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
        run: |
          test -n "$HEYGEN_API_KEY" && test -n "$HEYGEN_VOICE_ID"
          echo 'V11_REQUIRED_SECRETS_PRESENT'
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q Pillow numpy playwright
          python -m playwright install --with-deps chromium
      - name: Render one private personal-voice preview
        env:
          DARKLINE_HEYGEN_FREE_ENABLED: 'true'
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
        run: |
          python video/personal_voice_review_v11.py --url 'https://darkline-studio.web.app/demok/autoszerviz.html?skin=dark'
      - name: Report technical result without publishing media
        if: success()
        run: |
          python -c 'import json; from pathlib import Path; p=Path("private-preview-v11/auto"); v=json.loads((p/"voice_provenance.json").read_text()); q=json.loads((p/"quality.json").read_text()); print("V11_SANITIZED_RESULT",json.dumps({"model":v["model"],"profile":v["profile"],"speech_seconds":v["duration"],"review_gate":q["review_gate"],"frames":q["frames"],"publication":False}))'
      - name: Remove private voice media from public runner
        if: always()
        run: rm -rf private-preview-v11
