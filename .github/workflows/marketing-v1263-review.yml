name: Darkline V12.6.3 - staged Cloudflare Buffer HeyGen integration
on:
  push:
    branches: ['dev/v12.5.1-moss-private-review']
    paths: ['.github/workflows/marketing-v1263-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    if: github.ref == 'refs/heads/dev/v12.5.1-moss-private-review'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0578b45ee0c1a75265d53c43558583d6e55976e8
          path: approved-renderer
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test budget, slot plan, adapter and integration policy
        run: |
          python -m pip install -q 'numpy>=1.26,<3'
          export PYTHONPATH="$PWD/video:$PWD/approved-renderer/video"
          python video/heygen_budget_v126.py
          python video/daily_slots_v126.py
          python video/heygen_budget_adapter_v126.py
          python video/marketing_daily_v1263.py --selftest
          node --check video/worker_v1263_patch.mjs
          node approved-renderer/video/video_publish_gate_v12.test.mjs
      - name: Read current live Cloudflare video state only
        env:
          DARKLINE_TEST_TOKEN: ${{ secrets.DARKLINE_TEST_TOKEN }}
        run: python video/marketing_daily_v1263.py --preflight
