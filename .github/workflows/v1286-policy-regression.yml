name: Darkline V12.8.6 corrected daily policy regression
on:
  push:
    branches: ['dev/v12.8.1-private-integration']
    paths: ['.github/workflows/v1286-policy-regression.yml']
permissions:
  contents: read
jobs:
  checks:
    if: github.ref == 'refs/heads/dev/v12.8.1-private-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core ffmpeg libegl1 libgl1
          python -m pip install -q Pillow numpy playwright cryptography opencv-python-headless vtk
      - name: Verify policy, cutoff, units and no-voice guards
        run: |
          python video/daily_review_v1286.py --selftest
          python video/transitions_v1286.py --selftest
          python video/heygen_budget_v126.py
          python video/selection_v1266.py
          python video/marketing_daily_v1265.py --selftest
