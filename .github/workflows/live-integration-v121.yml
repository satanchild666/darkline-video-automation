name: Darkline V12.1 live private integration
on:
  push:
    branches: [dev/video-dedup-v1]
    paths: ['video/daily_mascot_v121.py','video/mascot_rig_v121.py','video/live_integration_v121.py','video/buffer_worker_adapter_v121.mjs','.github/workflows/live-integration-v121.yml']
permissions:
  contents: read
concurrency:
  group: darkline-v12-single-publisher
  cancel-in-progress: false
jobs:
  integration:
    if: vars.DARKLINE_HEYGEN_FREE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install renderer and test offline gates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q Pillow numpy playwright cryptography
          python -m playwright install --with-deps chromium
          node --check video/buffer_worker_adapter_v121.mjs
          node video/video_publish_gate_v12.test.mjs
          python -m py_compile video/mascot_rig_v121.py video/daily_mascot_v121.py video/live_integration_v121.py
          python video/daily_mascot_v121.py --selftest
      - name: Read-only real Buffer preflight
        env:
          DARKLINE_TEST_TOKEN: ${{ secrets.DARKLINE_TEST_TOKEN }}
        run: python video/live_integration_v121.py preflight
      - name: Render one real mascot service video, free-only
        env:
          DARKLINE_HEYGEN_FREE_ENABLED: 'true'
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
        run: |
          umask 077
          python video/daily_mascot_v121.py --key web
      - name: Verify actual release history and exercise live gate without publishing
        env:
          DARKLINE_TEST_TOKEN: ${{ secrets.DARKLINE_TEST_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python video/live_integration_v121.py candidate web
      - name: Upload encrypted owner review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Darkline-V12.1-ENCRYPTED-REVIEW
          path: sealed-review-v121/*.dlenc
          if-no-files-found: warn
          retention-days: 7
      - name: Clean private files
        if: always()
        run: rm -rf private-preview-v121 sealed-review-v121 creative-preview-v10
