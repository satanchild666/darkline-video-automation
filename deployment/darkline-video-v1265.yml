name: Darkline Studio - V12.6.5 budgeted daily marketing
on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Europe/Budapest'
    - cron: '17 13 * * *'
      timezone: 'Europe/Budapest'
    - cron: '7 15 * * *'
      timezone: 'Europe/Budapest'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/darkline-video.yml']
permissions:
  contents: read
concurrency:
  group: darkline-v12-single-publisher
  cancel-in-progress: false
jobs:
  marketing:
    if: github.ref == 'refs/heads/main' && vars.DARKLINE_HEYGEN_FREE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout tested budget and slot controller
        uses: actions/checkout@v4
        with:
          ref: 7a9396e9527e38b8cdb22e7f65e22ed762242a7a
          path: integration
          persist-credentials: false
      - name: Checkout exact owner-approved visual renderer
        uses: actions/checkout@v4
        with:
          ref: 0578b45ee0c1a75265d53c43558583d6e55976e8
          path: approved-renderer
          persist-credentials: false
      - name: Validate runtime window and live state without side effects
        id: preflight
        env:
          DARKLINE_TEST_TOKEN: ${{ secrets.DARKLINE_TEST_TOKEN }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/integration/video:$GITHUB_WORKSPACE/approved-renderer/video"
          python integration/video/heygen_budget_v126.py
          python integration/video/daily_slots_v126.py
          python integration/video/marketing_daily_v1263.py --selftest
          python integration/video/marketing_daily_v1265.py --selftest
          python - <<'PY'
          import datetime as dt, json, os
          from marketing_daily_v1263 import preflight,worker,TZ
          from marketing_daily_v1265 import current_kind,fallback_request,fallback_decision
          now=dt.datetime.now(dt.timezone.utc)
          kind=current_kind(now)
          day=now.astimezone(TZ).date().isoformat()
          token=os.environ["DARKLINE_TEST_TOKEN"]
          assert len(token)>=32
          status,m=worker("/posts-v126-morning",{"date":day,"dryRun":True},token)
          if status!=200 or m.get("status")!="V126_MORNING_PREFLIGHT_OK" or m.get("sideEffects") is not False:raise RuntimeError("Morning read-only gate unavailable")
          v=preflight(now,token)
          status,b=fallback_request({"date":day,"dryRun":True},token)
          if status!=200 or b.get("status")!="V1265_FALLBACK_PREFLIGHT_OK" or b.get("sideEffects") is not False:raise RuntimeError("Fallback read-only gate unavailable")
          print("V1265_PRODUCTION_PREFLIGHT",json.dumps({"morning":m,"video":v,"fallback":b,"event":os.environ["GITHUB_EVENT_NAME"]}),flush=True)
          # A push can NEVER generate, reserve, or publish.
          event=os.environ["GITHUB_EVENT_NAME"]
          expected={"17 9 * * *":"morning","17 13 * * *":"video","7 15 * * *":"fallback"}
          with open(os.environ["GITHUB_EVENT_PATH"]) as fp:payload=json.load(fp)
          execute=kind is not None and (event=="workflow_dispatch" or (event=="schedule" and expected.get(payload.get("schedule"))==kind))
          if kind=="morning":execute=execute and m.get("enabled") is True and not m.get("slotState")
          if kind=="video":execute=execute and v.get("dailyEnabled") is True and not v.get("publication") and not v.get("generation") and not b.get("prior")
          if kind=="fallback":execute=execute and fallback_decision(b,True,now)=="ALLOW_IMAGE"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("execute="+str(bool(execute)).lower()+"\n")
              f.write("slot="+str(kind or "none")+"\n")
              f.write("day="+day+"\n")
          PY
      - name: Install exact approved video dependencies only for afternoon
        if: steps.preflight.outputs.execute == 'true' && steps.preflight.outputs.slot == 'video'
        working-directory: approved-renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q 'Pillow>=11,<13' 'numpy>=1.26,<3' playwright cryptography
          python -m playwright install --with-deps chromium
          node video/video_publish_gate_v12.test.mjs
          python video/autonomous_daily_v124.py --selftest
          PYTHONPATH="$GITHUB_WORKSPACE/integration/video:$PWD/video" python "$GITHUB_WORKSPACE/integration/video/heygen_budget_adapter_v126.py"
      - name: Execute one authorized slot with guarded narration and no retries
        if: steps.preflight.outputs.execute == 'true'
        working-directory: approved-renderer
        env:
          GH_TOKEN: ${{ github.token }}
          DARKLINE_TEST_TOKEN: ${{ secrets.DARKLINE_TEST_TOKEN }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
          DARKLINE_V126_LIVE_ENABLED: 'true'
          DARKLINE_V126_EXPECTED_SLOT: ${{ steps.preflight.outputs.slot }}
          DARKLINE_V126_EXPECTED_DATE: ${{ steps.preflight.outputs.day }}
          DARKLINE_HEYGEN_PAID_ENABLED: 'true'
          DARKLINE_HEYGEN_PRICE_CHECKED_UTC: '2026-11-26'
          DARKLINE_HEYGEN_RATE_CEILING: '15'
        run: |
          umask 077
          export PYTHONPATH="$GITHUB_WORKSPACE/integration/video:$PWD/video"
          python "$GITHUB_WORKSPACE/integration/video/marketing_daily_v1265.py" --execute
      - name: Encrypted review only
        if: always() && steps.preflight.outputs.execute == 'true' && steps.preflight.outputs.slot == 'video'
        uses: actions/upload-artifact@v4
        with:
          name: Darkline-V1265-DAILY-ENCRYPTED-REVIEW
          path: approved-renderer/sealed-review-v124/*.dlenc
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean private files
        if: always()
        run: rm -rf approved-renderer/private-preview-v124 approved-renderer/sealed-review-v124 approved-renderer/creative-preview-v10
